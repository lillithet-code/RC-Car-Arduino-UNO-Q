<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; }
    a { color: #93c5fd; }
    body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #f8fafc; }
    .box { max-width: 420px; margin: 4rem auto; background: #111827; padding: 2rem; border-radius: 16px; }
    input { width: 100%; margin: 0.4rem 0 1rem; padding: 0.7rem; border-radius: 8px; border: 1px solid #334155; }
    button { padding: 0.7rem 1rem; border-radius: 8px; background: #2563eb; color: white; border: 0; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Login</h1>
    {% for message in get_flashed_messages(category_filter=['registration']) %}
    <p role="status">{{ message }}</p>
    {% endfor %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ account_csrf() }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="80" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <button type="submit">Login</button>
    </form>
    <p><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
    <p><a href="{{ url_for('resend_confirmation') }}">Resend confirmation email</a></p>
    <p><a href="{{ url_for('register') }}">Need an account?</a></p>
  </div>
</body>
</html>
