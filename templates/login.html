<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #f8fafc; }
    .box { max-width: 420px; margin: 4rem auto; background: #111827; padding: 2rem; border-radius: 16px; }
    input { width: 100%; margin: 0.4rem 0 1rem; padding: 0.7rem; border-radius: 8px; border: 1px solid #334155; }
    button { padding: 0.7rem 1rem; border-radius: 8px; background: #2563eb; color: white; border: 0; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Login</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label>Username</label>
      <input name="username" required>
      <label>Password</label>
      <input name="password" type="password" required>
      <button type="submit">Login</button>
    </form>
    <p><a href="{{ url_for('register') }}">Need an account?</a></p>
  </div>
</body>
</html>
