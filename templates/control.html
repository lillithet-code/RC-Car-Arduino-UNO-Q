<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RC Car Control</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: linear-gradient(135deg, #0f172a, #111827); color: #f8fafc; }
    .container { max-width: 1080px; margin: 0 auto; padding: 2rem; }
    .panel { background: rgba(17,24,39,0.92); padding: 1.35rem; border-radius: 20px; box-shadow: 0 18px 40px rgba(0,0,0,0.25); margin-bottom: 1rem; }
    .stream { width: 100%; max-width: 720px; border-radius: 20px; border: 2px solid #334155; }
    .joystick { width: 220px; height: 220px; border-radius: 50%; margin: 1rem auto; background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 70%); position: relative; border: 3px solid #60a5fa; touch-action: none; }
    .knob { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #fbbf24, #f59e0b); position: absolute; top: 75px; left: 75px; cursor: pointer; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <h1>RC Car Control</h1>
      {% if session %}
        <p>Connected to: {{ session.name }}</p>
      {% else %}
        <p>No active session yet.</p>
      {% endif %}
      <a href="{{ url_for('index') }}">Back to dashboard</a>
    </div>
    <div class="panel">
      <img class="stream" src="{{ url_for('static', filename='stream_placeholder.jpg') }}" alt="Video stream placeholder">
      <div class="joystick" id="joystick">
        <div class="knob" id="knob"></div>
      </div>
      <p>Use the joystick to send driving commands. The actual stream and hardware control can be connected in the next step.</p>
    </div>
  </div>
  <script>
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('knob');
    let dragging = false;

    function sendAction(action) {
      fetch('/api/control', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action })
      });
    }

    function updateFromPointer(x, y) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = Math.max(-1, Math.min(1, (x - centerX) / (rect.width / 2)));
      const dy = Math.max(-1, Math.min(1, (y - centerY) / (rect.height / 2)));
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      let action = 'stop';
      if (absX > absY) {
        action = dx > 0 ? 'right' : 'left';
      } else if (absY > absX) {
        action = dy > 0 ? 'back' : 'forward';
      }
      knob.style.left = `${75 + dx * 55}px`;
      knob.style.top = `${75 + dy * 55}px`;
      sendAction(action);
    }

    joystick.addEventListener('pointerdown', (event) => {
      dragging = true;
      joystick.setPointerCapture(event.pointerId);
      updateFromPointer(event.clientX, event.clientY);
    });

    joystick.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      updateFromPointer(event.clientX, event.clientY);
    });

    joystick.addEventListener('pointerup', () => {
      dragging = false;
      knob.style.left = '75px';
      knob.style.top = '75px';
      sendAction('stop');
    });
    joystick.addEventListener('pointercancel', () => {
      dragging = false;
      knob.style.left = '75px';
      knob.style.top = '75px';
      sendAction('stop');
    });
  </script>
</body>
</html>
