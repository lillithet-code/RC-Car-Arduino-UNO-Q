logLevel: info

rtspAddress: :8554
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts:
  - drive.kbob.org

api: yes
apiAddress: 127.0.0.1:9997

# Streams are dynamic. Boards publish to paths like /cars/<board_name>.
# Browsers subscribe via WHEP at /cars/<board_name>/whep.
paths:
  all_others:
    source: publisher
